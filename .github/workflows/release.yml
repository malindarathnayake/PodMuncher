# Podmuncher release workflow.
#
# tests + ruff -> build and push the worker images to ghcr.io (native amd64 and arm64
# runners, merged into one multi-arch index per image) -> write the pushed digests into a copy
# of release.json -> build the wheel with it -> GitHub Release. No PyPI upload.
#
# Security testing (SBOM and CVE scan) runs locally before tagging with
# bin/security_scan.py; its reports are committed under security/.
#
# Configuration (repository variable or workflow_dispatch input; no secrets beyond GITHUB_TOKEN):
#   PODMUNCHER_PUBLISHER_NAMESPACE  ghcr.io namespace (defaults to the repository owner).

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version; must equal the package version (pyproject.toml).
        required: true
        type: string
      namespace:
        description: Optional ghcr.io namespace; overrides the PODMUNCHER_PUBLISHER_NAMESPACE variable.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked environment
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
      - name: Ruff
        if: runner.os == 'Linux'
        shell: bash
        run: python -m ruff check src tests
      - name: Non-live test suite
        shell: bash
        run: python -m pytest -q -m "not live" --basetemp "$RUNNER_TEMP/pytest"

  config:
    name: version and namespace
    needs: [tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      namespace: ${{ steps.config.outputs.namespace }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
          NAMESPACE_INPUT: ${{ inputs.namespace }}
          NAMESPACE_VARIABLE: ${{ vars.PODMUNCHER_PUBLISHER_NAMESPACE }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then VERSION="${REF_NAME#v}"; else VERSION="$VERSION_INPUT"; fi
          PACKAGE="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$PACKAGE" ]; then
            echo "::error::release version $VERSION differs from pyproject.toml version $PACKAGE"; exit 1
          fi
          NAMESPACE="${NAMESPACE_INPUT:-${NAMESPACE_VARIABLE:-$REPOSITORY_OWNER}}"
          NAMESPACE="${NAMESPACE,,}"
          {
            echo "version=$VERSION"
            echo "namespace=$NAMESPACE"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION namespace=$NAMESPACE"

  build:
    name: image / ${{ matrix.capability }} ${{ matrix.platform }}
    needs: [config]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - capability: media
            platform: linux-amd64
            docker_platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: containers/media.Dockerfile
            target: ""
          - capability: media
            platform: linux-arm64
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: containers/media.Dockerfile
            target: ""
          - capability: asr_cpu
            platform: linux-amd64
            docker_platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: containers/asr.Dockerfile
            target: cpu
          - capability: asr_cpu
            platform: linux-arm64
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: containers/asr.Dockerfile
            target: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.docker_platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ needs.config.outputs.namespace }}/podmuncher-${{ matrix.capability }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the platform digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CAPABILITY: ${{ matrix.capability }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${CAPABILITY}-${PLATFORM}.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.capability }}-${{ matrix.platform }}
          path: digests/
          if-no-files-found: error
          retention-days: 7

  merge:
    name: image / ${{ matrix.capability }} multi-arch index
    needs: [config, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        capability: [media, asr_cpu]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.capability }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the OCI index (linux/amd64 + linux/arm64) and record it
        shell: bash
        env:
          NAMESPACE: ${{ needs.config.outputs.namespace }}
          VERSION: ${{ needs.config.outputs.version }}
          CAPABILITY: ${{ matrix.capability }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${NAMESPACE}/podmuncher-${CAPABILITY}"
          AMD64="$(cat "digests/${CAPABILITY}-linux-amd64.digest")"
          ARM64="$(cat "digests/${CAPABILITY}-linux-arm64.digest")"
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" > index.json
          mkdir -p published
          python3 - "$IMAGE" "$CAPABILITY" index.json "published/${CAPABILITY}.json" "$AMD64" "$ARM64" <<'PY'
          import hashlib, json, sys
          image, capability, index_path, out_path, amd64, arm64 = sys.argv[1:]
          raw = open(index_path, "rb").read()
          found = {m["platform"]["os"] + "-" + m["platform"]["architecture"]: m["digest"]
                   for m in json.loads(raw)["manifests"]}
          assert found == {"linux-amd64": amd64, "linux-arm64": arm64}, found
          record = {"capability": capability, "image_reference": image,
                    "digest": "sha256:" + hashlib.sha256(raw).hexdigest(),
                    "platforms": ["linux-amd64", "linux-arm64"], "platform_digests": found}
          json.dump(record, open(out_path, "w"), indent=1, sort_keys=True)
          print(f"{image}@{record['digest']}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.capability }}
          path: published/
          if-no-files-found: error
          retention-days: 30

  cuda:
    name: image / asr_cuda linux-amd64
    needs: [config]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk for the CUDA image
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the CUDA image (linux/amd64 only)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/asr.Dockerfile
          target: cuda
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/${{ needs.config.outputs.namespace }}/podmuncher-asr_cuda:${{ needs.config.outputs.version }}
      - name: Record the image digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.config.outputs.namespace }}/podmuncher-asr_cuda
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p published
          printf '{"capability": "asr_cuda", "image_reference": "%s", "digest": "%s", "platforms": ["linux-amd64"], "platform_digests": {"linux-amd64": "%s"}}\n' \
            "$IMAGE" "$DIGEST" "$DIGEST" > published/asr_cuda.json
          cat published/asr_cuda.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-asr_cuda
          path: published/
          if-no-files-found: error
          retention-days: 30

  release:
    name: release / finalize release.json, wheel, GitHub Release
    needs: [config, merge, cuda]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked environment
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - name: Write the pushed digests into release.json and build the wheel
        shell: bash
        env:
          NAMESPACE: ${{ needs.config.outputs.namespace }}
          VERSION: ${{ needs.config.outputs.version }}
        run: |
          set -euo pipefail
          python tests/test_release_gates.py finalize --manifest src/podmuncher/manifests/release.json \
            --published-dir published --namespace "$NAMESPACE" --version "$VERSION" \
            --nvidia-reviewed true --publish-cuda true \
            --output dist-manifest/release.json
          cp dist-manifest/release.json src/podmuncher/manifests/release.json
          python -m build --wheel --no-isolation --outdir dist
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install --no-deps dist/*.whl
          [ "$("$RUNNER_TEMP/clean-venv/bin/podmuncher" --version)" = "podmuncher $VERSION" ]
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.config.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dist/*.whl dist-manifest/release.json upload/
          cp skills/podmuncher-install/SKILL.md upload/podmuncher-install-SKILL.md
          cp skills/podmuncher/SKILL.md upload/podmuncher-SKILL.md
          tar -czf upload/security.tar.gz security
          python3 - dist-manifest/release.json > notes.md <<'PY'
          import json, sys
          document = json.load(open(sys.argv[1]))
          print(f"Podmuncher {document['release_version']}\n")
          print("Images (pull by digest):")
          for capability, image in sorted(document["registry"]["images"].items()):
              if image["registry_digest"]:
                  print(f"- {capability}: {image['image_reference']}@{image['registry_digest']} ({', '.join(image['platforms'])})")
              else:
                  print(f"- {capability}: not published in this release")
          print("\nSBOMs and CVE scan reports: security/ in the repository (also attached as security.tar.gz).")
          PY
          PRERELEASE=""
          case "$VERSION" in *dev*|*a*|*b*|*rc*) PRERELEASE="--prerelease" ;; esac
          # A release created by hand (e.g. to push the tag) is updated in place.
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" --repo "$GITHUB_REPOSITORY" --clobber upload/*
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --title "podmuncher ${VERSION}" --notes-file notes.md $PRERELEASE
          else
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "podmuncher ${VERSION}" --notes-file notes.md $PRERELEASE upload/*
          fi
